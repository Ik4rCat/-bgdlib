<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGDLib Editor</title>
<link rel="stylesheet" href="easymde.min.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e2e; color: #cdd6f4; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  .editor-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .CodeMirror { background: #1e1e2e !important; color: #cdd6f4 !important; height: 100% !important; font-size: 15px; }
  .CodeMirror-scroll { height: 100% !important; }
  .editor-toolbar { background: #313244 !important; border-color: #45475a !important; }
  .editor-toolbar button { color: #cdd6f4 !important; }
  .editor-toolbar button:hover, .editor-toolbar button.active { background: #45475a !important; }
  .EasyMDEContainer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .EasyMDEContainer .CodeMirror { flex: 1; }
  .editor-preview { background: #1e1e2e !important; color: #cdd6f4 !important; }
  .editor-preview pre { background: #313244 !important; padding: 8px; border-radius: 4px; }
  .editor-preview code { color: #a6e3a1 !important; }
</style>
</head>
<body>
<div class="editor-wrapper">
  <textarea id="editor"></textarea>
</div>

<script src="easymde.min.js"></script>
<script>
  const easyMDE = new EasyMDE({
    element: document.getElementById('editor'),
    autofocus: true,
    spellChecker: false,
    autosave: { enabled: false },
    toolbar: [
      'bold', 'italic', 'heading', '|',
      'quote', 'code', 'unordered-list', 'ordered-list', '|',
      'link', '|',
      'preview', 'side-by-side', 'fullscreen', '|',
      {
        name: 'save',
        action: () => saveContent(),
        className: 'fa fa-save',
        title: 'Сохранить'
      },
      {
        name: 'export',
        action: () => exportNote(),
        className: 'fa fa-download',
        title: 'Экспорт .md'
      }
    ],
    shortcuts: { 'toggleSideBySide': null, 'toggleFullScreen': null }
  });

  // C# → JS: загрузить контент
  function setContent(text) {
    easyMDE.value(text);
  }

  // JS → C#: сохранить
  function saveContent() {
    const content = easyMDE.value();
    // MAUI WebView перехватывает навигацию на bgdlib://
    window.location.href = 'bgdlib://save?content=' + encodeURIComponent(content);
  }

  function exportNote() {
    window.location.href = 'bgdlib://export';
  }

  // Автосохранение каждые 30 сек
  setInterval(saveContent, 30000);
</script>
</body>
</html>
